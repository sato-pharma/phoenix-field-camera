name: build

# Builds the signed Phoenix Camera APK, and the rep tablets' Phoenix Position agent beside it. The release key lives
# only in the repository secrets; it is written to the runner's temporary folder for the build and never into the
# workspace. Each build proves its APK is signed with the certificate Phoenix trusts (FIELD_CAMERA_SIGNING_DIGEST in
# phoenix-workforce), so a wrong key fails here and not on a rep's phone.

on:
  push:
    branches: [main]
  # Every pull request builds, signs and installs the APK, so a change that will not install never reaches a rep.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_CERT_SHA256: 4417e26fb1a41c4d374297f305f043edeee00e11c55a14bd5ae69fff1ff1f4f1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Write the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOENIX_CAMERA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "The PHOENIX_CAMERA_KEYSTORE_BASE64 secret is missing."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "PHOENIX_CAMERA_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          PHOENIX_CAMERA_STORE_PASSWORD: ${{ secrets.PHOENIX_CAMERA_STORE_PASSWORD }}
          PHOENIX_CAMERA_KEY_ALIAS: phoenixcamera
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prove the signing certificate
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "No signed APK was produced."; ls -R app/build/outputs/apk || true; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" "$RUNNER_TEMP/certs.txt" \
            || { echo "The APK is not signed with the certificate Phoenix trusts."; exit 1; }
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$version" || { echo "No versionName in app/build.gradle.kts."; exit 1; }
          cp "$apk" "Phoenix-Camera-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Camera
          path: Phoenix-Camera-*.apk
          retention-days: 30

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

  # Proves the signed APK installs and opens on a real Android system, oldest and newest: the 20 Nov 2026 "App not
  # installed" report. The emulator is refused by the app's own phone checks, which is the screen it should show.
  install-check:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 26, arch: x86, target: default }
          - { api: 34, arch: x86_64, target: google_apis }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Phoenix-Camera

      - name: Enable the emulator's hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, open and photograph the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          disable-animations: true
          script: |
            adb install -r "$(ls Phoenix-Camera-*.apk | head -n 1)" 2>&1 | tee install.txt; grep -q Success install.txt
            adb shell dumpsys package com.satopharma.phoenixcamera | grep -E "versionCode|versionName"
            adb shell pm grant com.satopharma.phoenixcamera android.permission.CAMERA || true
            adb shell pm grant com.satopharma.phoenixcamera android.permission.ACCESS_FINE_LOCATION || true
            adb logcat -c || true
            adb shell am start -W -n com.satopharma.phoenixcamera/.MainActivity
            sleep 10
            adb exec-out screencap -p > screen-api${{ matrix.api }}.png
            adb logcat -d -b crash | tee crash.txt; test ! -s crash.txt
            adb shell pidof com.satopharma.phoenixcamera

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-check-api${{ matrix.api }}
          path: |
            install.txt
            crash.txt
            screen-api*.png
          retention-days: 14

  # The rep tablets' own Phoenix Position agent: its own package, signed with the same key.
  position:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_CERT_SHA256: 4417e26fb1a41c4d374297f305f043edeee00e11c55a14bd5ae69fff1ff1f4f1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Write the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOENIX_CAMERA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "The PHOENIX_CAMERA_KEYSTORE_BASE64 secret is missing."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "PHOENIX_CAMERA_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          PHOENIX_CAMERA_STORE_PASSWORD: ${{ secrets.PHOENIX_CAMERA_STORE_PASSWORD }}
          PHOENIX_CAMERA_KEY_ALIAS: phoenixcamera
        run: gradle :position:assembleRelease --no-daemon --stacktrace

      - name: Prove the signing certificate
        run: |
          apk=position/build/outputs/apk/release/position-release.apk
          test -f "$apk" || { echo "No signed APK was produced."; ls -R position/build/outputs/apk || true; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/position-certs.txt"
          grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" "$RUNNER_TEMP/position-certs.txt" \
            || { echo "The APK is not signed with the certificate Phoenix trusts."; exit 1; }
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' position/build.gradle.kts | head -n 1)
          test -n "$version" || { echo "No versionName in position/build.gradle.kts."; exit 1; }
          cp "$apk" "Phoenix-Position-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Position
          path: Phoenix-Position-*.apk
          retention-days: 30

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

  # Proves the agent installs, starts once, schedules its quarter-hourly round, and then has no icon left to open.
  #
  # The emulator MUST NOT be able to reach Phoenix: the agent's first round says hello, and a build that reaches
  # production leaves an unbound junk install in the real data. `svc data disable` and `svc wifi disable` DO NOT
  # achieve that — they ran silently on the API 26 emulator on 26 Nov 2026 and it enrolled itself in PRODUCTION
  # twice anyway, because qemu's user-mode network is not the mobile radio those toggles switch. So the emulator is
  # booted with `-dns-server 127.0.0.1`: nothing in the guest can resolve a name, and the step below proves that
  # before the APK is installed and fails the job if it ever resolves again. Offline the round still runs and the
  # scheduler still shows it, which is what this check is for.
  position-install-check:
    needs: position
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 26, arch: x86, target: default }
          - { api: 34, arch: x86_64, target: google_apis }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Phoenix-Position

      - name: Enable the emulator's hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install it, start it once, and prove the round is scheduled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -dns-server 127.0.0.1
          script: |
            adb shell svc data disable || true
            adb shell svc wifi disable || true
            # PROVE the guest cannot resolve Phoenix, before anything is installed. A resolved name here means a
            # junk install would land in production, so the job stops instead.
            adb shell ping -c 1 -W 2 phoenix-hr.satopharma.com 2>&1 | tee dns.txt || true
            cat dns.txt
            # ONE LINE, no backslash continuation: this runner hands each LINE of the script to its own
            # `sh -c`, so a continued line reaches the shell alone and dies as a syntax error (exit 2).
            grep -qiE "unknown host|bad address|name resolution|No address associated" dns.txt || { echo "The emulator can still resolve Phoenix — refusing to go on; this build would enrol a junk install in PRODUCTION."; exit 1; }
            adb install -r "$(ls Phoenix-Position-*.apk | head -n 1)" 2>&1 | tee install.txt; grep -q Success install.txt
            adb shell dumpsys package com.satopharma.phoenixposition | grep -E "versionCode|versionName"
            adb shell pm grant com.satopharma.phoenixposition android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.satopharma.phoenixposition android.permission.ACCESS_COARSE_LOCATION || true
            adb shell pm grant com.satopharma.phoenixposition android.permission.ACCESS_BACKGROUND_LOCATION || true
            adb logcat -c || true
            # NO -W HERE, and a hard timeout. `am start -W` waits for the activity to report itself displayed and
            # idle; StartActivity draws no window and finishes inside onCreate, so on API 26 that wait never ends —
            # the 26 Nov 2026 run printed "Starting: Intent { … }" and then sat there until the job's own 30-minute
            # timeout killed it (API 34's ActivityManager returns anyway). The start is fire-and-forget by design;
            # the sleep below, the crash log and the scheduler are what prove it worked.
            timeout 60 adb shell am start -n com.satopharma.phoenixposition/.StartActivity
            sleep 20
            adb logcat -d -b crash | tee crash.txt; test ! -s crash.txt
            # The quarter-hourly round is with Android's own scheduler.
            adb shell dumpsys jobscheduler | tee jobs.txt | grep -q com.satopharma.phoenixposition
            # And the one thing that was visible has taken itself away: starting it again resolves to nothing.
            timeout 60 adb shell am start -n com.satopharma.phoenixposition/.StartActivity 2>&1 | tee second.txt
            grep -qiE "does not exist|disabled|unable to resolve|Error" second.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: position-install-check-api${{ matrix.api }}
          path: |
            dns.txt
            install.txt
            crash.txt
            jobs.txt
            second.txt
          retention-days: 14
