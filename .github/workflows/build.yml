name: build

# Builds the signed Phoenix Camera APK. The release key lives only in the repository secrets; it is written to the
# runner's temporary folder for the build and never into the workspace. The last step proves the APK is signed with
# the certificate Phoenix trusts (FIELD_CAMERA_SIGNING_DIGEST in phoenix-workforce), so a wrong key fails here and
# not on a rep's phone.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_CERT_SHA256: 4417e26fb1a41c4d374297f305f043edeee00e11c55a14bd5ae69fff1ff1f4f1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Write the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOENIX_CAMERA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "The PHOENIX_CAMERA_KEYSTORE_BASE64 secret is missing."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "PHOENIX_CAMERA_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          PHOENIX_CAMERA_STORE_PASSWORD: ${{ secrets.PHOENIX_CAMERA_STORE_PASSWORD }}
          PHOENIX_CAMERA_KEY_ALIAS: phoenixcamera
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prove the signing certificate
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "No signed APK was produced."; ls -R app/build/outputs/apk || true; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" "$RUNNER_TEMP/certs.txt" \
            || { echo "The APK is not signed with the certificate Phoenix trusts."; exit 1; }
          cp "$apk" Phoenix-Camera-1.0.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Camera
          path: Phoenix-Camera-1.0.1.apk
          retention-days: 30

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
